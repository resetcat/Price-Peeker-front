<nav [attr.aria-label]="'categories.title' | translate" class="pp-card flex flex-col gap-0.5 p-3">
  @if (showTitle) {
    <p class="pp-overline px-3 pb-2 pt-1.5">{{ 'categories.title' | translate }}</p>
  }

  @if (loading) {
    <div class="flex justify-center py-6">
      <span class="loading loading-spinner text-primary"></span>
    </div>
  }
  @if (error) {
    <p class="px-3 py-2 text-sm text-muted">
      {{ 'categories.loadError' | translate }}
    </p>
  }

  @for (category of categories; track category) {
    <button
      type="button"
      class="pp-nav-item font-semibold"
      [attr.aria-expanded]="hasChildren(category) ? isExpanded(category) : null"
      (click)="toggle(category)"
      >
      <span class="flex-1">{{ lang.categoryName(category.name) }}</span>
      @if (isSale(category)) {
        <span
          class="badge badge-secondary h-5 border-0 px-2 text-[11px] font-bold"
          >%</span
          >
        }
        @if (hasChildren(category)) {
          <app-icon
            name="chevron-down"
            class="h-4 w-4 text-muted transition-transform"
            [class.rotate-180]="isExpanded(category)"
          ></app-icon>
        }
      </button>
      @if (hasChildren(category) && isExpanded(category)) {
        <div
          class="flex flex-col gap-0.5 pb-1 pl-3"
          >
          @for (sub of category.categories; track sub) {
            <button
              type="button"
              class="pp-nav-sub"
              [attr.aria-current]="sub.id === (activeId$ | async) ? 'true' : null"
              (click)="select(sub)"
              >
              {{ lang.categoryName(sub.name) }}
            </button>
          }
        </div>
      }
    }
  </nav>
