<footer class="bg-base-300 text-base-content">
  <div class="pp-container flex flex-wrap justify-between gap-10 py-8">
    <div class="flex max-w-xs flex-col gap-2">
      <span class="pp-logo w-[130px]" role="img" aria-label="Price Peeker"></span>
      <p class="text-[13px] leading-5 text-muted">
        Salīdzini cenas Latvijas veikalos un ietaupi.
      </p>
    </div>

    <div class="flex flex-wrap gap-x-14 gap-y-8">
      <nav class="flex flex-col items-start gap-2 text-sm" aria-labelledby="footer-account">
        <h6 id="footer-account" class="pp-overline">Konts</h6>
        <a class="hover:text-link" routerLink="/login">Ienākt</a>
        <a class="hover:text-link" routerLink="/register">Reģistrēties</a>
      </nav>
      <nav class="flex flex-col items-start gap-2 text-sm" aria-labelledby="footer-explore">
        <h6 id="footer-explore" class="pp-overline">Izpēti</h6>
        <button type="button" class="hover:text-link" (click)="openTelegramInstructions()">
          Telegram instrukcija
        </button>
        <button type="button" class="hover:text-link" (click)="openNotifications()">
          Paziņojumi
        </button>
      </nav>
      <nav class="flex flex-col gap-2 text-sm" aria-labelledby="footer-contacts">
        <h6 id="footer-contacts" class="pp-overline">Kontakti</h6>
        <div class="flex gap-2">
          <a
            href="https://www.linkedin.com/in/mihails-dudarevs/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
            class="pp-icon-btn h-10 w-10 rounded-xl bg-base-100 hover:text-link"
          >
            <app-icon name="linkedin" class="h-[18px] w-[18px]"></app-icon>
          </a>
          <a
            href="mailto:dudarevs.mihails@gmail.com"
            aria-label="E-pasts"
            class="pp-icon-btn h-10 w-10 rounded-xl bg-base-100 hover:text-link"
          >
            <app-icon name="mail" class="h-[18px] w-[18px]"></app-icon>
          </a>
          <a
            href="https://www.github.com/resetcat"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            class="pp-icon-btn h-10 w-10 rounded-xl bg-base-100 hover:text-link"
          >
            <app-icon name="github" class="h-[18px] w-[18px]"></app-icon>
          </a>
        </div>
      </nav>
    </div>
  </div>
  <!-- room for the mobile bottom navigation -->
  <div class="h-[68px] lg:hidden" aria-hidden="true"></div>
</footer>
