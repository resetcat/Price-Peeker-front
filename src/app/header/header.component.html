<header class="sticky top-0 z-30 bg-primary text-primary-content shadow-sm">
  <div
    class="pp-container flex flex-wrap items-center gap-3 py-3 lg:flex-nowrap lg:gap-5"
  >
    <!-- Logo -->
    <a routerLink="/" class="order-1 shrink-0" aria-label="Price Peeker — sākums">
      <span class="pp-logo w-32 lg:w-[150px]"></span>
    </a>

    <!-- Store type switch: Pārtika / Alkohols (/ Aptiekas) — from shops.config.ts -->
    <div
      class="pp-seg order-4 w-full lg:order-2 lg:w-auto"
      role="group"
      aria-label="Veikalu veids"
    >
      <button
        *ngFor="let type of shopTypes"
        type="button"
        class="pp-seg-btn"
        [attr.aria-pressed]="type.id === currentShopType"
        (click)="selectShopType(type.id)"
      >
        <app-icon [name]="type.icon" class="h-[18px] w-[18px]"></app-icon>
        {{ type.label }}
      </button>
    </div>

    <!-- Search -->
    <form
      role="search"
      class="pp-search order-3 w-full lg:order-3 lg:w-auto lg:flex-1"
      (ngSubmit)="getProducts()"
    >
      <app-icon name="search" class="h-5 w-5 opacity-60"></app-icon>
      <label for="search" class="sr-only">Meklēt preces</label>
      <input
        #searchInput
        id="search"
        name="search"
        type="text"
        inputmode="search"
        enterkeyhint="search"
        autocomplete="off"
        placeholder="meklēt..."
        [(ngModel)]="searchQuery"
        [disabled]="(loading$ | async) === true"
      />
      <button
        *ngIf="searchQuery"
        type="button"
        class="pp-icon-btn h-10 w-10 opacity-60 hover:opacity-100"
        aria-label="Notīrīt meklēšanu"
        (click)="clearSearch()"
      >
        <app-icon name="x" class="h-[18px] w-[18px]"></app-icon>
      </button>
      <button
        type="submit"
        class="btn btn-accent h-10 min-h-0 rounded-full px-4 text-sm font-bold sm:px-5"
        aria-label="Meklēt"
        [disabled]="(loading$ | async) === true"
      >
        <span *ngIf="(loading$ | async) === true" class="loading loading-spinner loading-xs"></span>
        <app-icon name="search" [stroke]="2.4" class="h-[18px] w-[18px] sm:hidden"></app-icon>
        <span class="hidden sm:inline">Meklēt</span>
      </button>
    </form>

    <!-- Actions -->
    <div class="order-2 ml-auto flex items-center gap-2 lg:order-4">
      <button
        type="button"
        class="pp-hdr-btn"
        [attr.aria-label]="isDarkTheme ? 'Ieslēgt gaišo režīmu' : 'Ieslēgt tumšo režīmu'"
        (click)="toggleTheme()"
      >
        <app-icon [name]="isDarkTheme ? 'sun' : 'moon'" class="h-5 w-5"></app-icon>
      </button>
      <ng-container *ngIf="isLoggedIn$ | async; else loggedOut">
        <button
          type="button"
          class="pp-hdr-btn hidden lg:inline-flex"
          aria-label="Mani paziņojumi"
          (click)="openNotifications()"
        >
          <app-icon name="bell" class="h-5 w-5"></app-icon>
        </button>
        <button
          type="button"
          class="pp-hdr-btn hidden lg:inline-flex"
          aria-label="Iziet"
          (click)="logout()"
        >
          <app-icon name="logout" class="h-5 w-5"></app-icon>
        </button>
      </ng-container>
      <ng-template #loggedOut>
        <a routerLink="/login" class="pp-login hidden lg:inline-flex">
          <app-icon name="user" class="h-[18px] w-[18px]"></app-icon>
          Ienākt
        </a>
      </ng-template>
    </div>
  </div>
</header>

<!-- Mobile: bottom navigation -->
<nav
  class="fixed inset-x-0 bottom-0 z-30 grid h-[68px] grid-cols-4 border-t border-card-line bg-base-100 lg:hidden"
  aria-label="Galvenā navigācija"
>
  <button
    type="button"
    class="pp-tab"
    [attr.aria-current]="router.url === '/' && !drawerOpen ? 'page' : null"
    (click)="focusSearch()"
  >
    <app-icon name="search" class="h-[22px] w-[22px]"></app-icon>
    Meklēt
  </button>
  <button
    type="button"
    class="pp-tab"
    [attr.aria-current]="drawerOpen ? 'page' : null"
    (click)="drawerOpen = true"
  >
    <app-icon name="grid" class="h-[22px] w-[22px]"></app-icon>
    Kategorijas
  </button>
  <ng-container *ngIf="isLoggedIn$ | async; else tabsLoggedOut">
    <button type="button" class="pp-tab" (click)="openNotifications()">
      <app-icon name="bell" class="h-[22px] w-[22px]"></app-icon>
      Paziņojumi
    </button>
    <button type="button" class="pp-tab" (click)="logout()">
      <app-icon name="logout" class="h-[22px] w-[22px]"></app-icon>
      Iziet
    </button>
  </ng-container>
  <ng-template #tabsLoggedOut>
    <a routerLink="/login" class="pp-tab">
      <app-icon name="bell" class="h-[22px] w-[22px]"></app-icon>
      Paziņojumi
    </a>
    <a
      routerLink="/login"
      class="pp-tab"
      [attr.aria-current]="router.url === '/login' || router.url === '/register' ? 'page' : null"
    >
      <app-icon name="user" class="h-[22px] w-[22px]"></app-icon>
      Ienākt
    </a>
  </ng-template>
</nav>

<!-- Mobile: category drawer (desktop shows categories in the sidebar) -->
<div class="drawer lg:hidden">
  <input
    id="category-drawer"
    type="checkbox"
    class="drawer-toggle"
    [(ngModel)]="drawerOpen"
  />
  <div class="drawer-content"></div>
  <div class="drawer-side z-40">
    <label
      for="category-drawer"
      class="drawer-overlay"
      aria-label="Aizvērt kategorijas"
    ></label>
    <div class="flex min-h-full w-80 max-w-[85vw] flex-col gap-4 bg-base-200 p-4">
      <div class="flex items-center justify-between">
        <h2 class="font-display text-xl font-bold">Kategorijas</h2>
        <label
          for="category-drawer"
          class="pp-icon-btn cursor-pointer bg-base-100"
          aria-label="Aizvērt"
        >
          <app-icon name="x" class="h-[18px] w-[18px]"></app-icon>
        </label>
      </div>
      <app-category-nav
        [showTitle]="false"
        (selected)="onCategorySelected()"
      ></app-category-nav>
    </div>
  </div>
</div>
