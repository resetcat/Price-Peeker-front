<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <title>Price Peeker</title>
    <meta name="description" content="Find the best deals on alcohol, groceries, and more at Price Peeker. Compare prices and save!" />
    <meta name="keywords" content="Price Peeker, best deals, alcohol prices, groceries, compare prices" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.png" />
    <link rel="preload" href="/assets/images/not-found.png" as="image" />
  </head>
  <body>
    <script>
      // Apply the saved theme before Angular starts, so dark mode doesn't flash white.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'business') t = 'peeker-dark';
          if (t === 'cupcake') t = 'peeker-light';
          if (t !== 'peeker-light' && t !== 'peeker-dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'peeker-dark' : 'peeker-light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
